# llama-swap config.yaml — Starter template for Unraid
# Place this file at: /mnt/user/appdata/llama-swap/config/config.yaml
# Place your GGUF files at: /mnt/user/appdata/llama-swap/models/
#
# The container mounts your models folder to /models
# so reference them as /models/yourfile.gguf
#
# YAML notes:
# - Use spaces, not tabs
# - Keep indentation consistent
# - Quote model keys if they contain dots, colons, or other punctuation
#
# Edit this file and save — llama-swap will auto-reload (watch-config enabled).

healthCheckTimeout: 120
logLevel: info

# ---- Macros ----
# Define common llama-server flags once and reuse with ${macro_name}
macros:
  common: >
    llama-server
    --port ${PORT}
    --host 0.0.0.0
    -ngl 999
    --ctx-size 8192
    --no-webui

# ---- Models ----
# Add one entry per GGUF file in your models folder.
# The key (e.g. "qwen3-8b") is the model name used in API requests.
models:
  "qwen3.5-9b":
    name: "Qwen3.5 9B Uncensored"
    cmd: |
      ${common}
      --model /models/Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
    ttl: 3600

